name: Build APK (personal fork)

on:
  workflow_dispatch:

concurrency:
  group: build-apk-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      # v1.6.5 evaluates the release signing block even for a debug build.
      # This temporary keystore is only a Gradle configuration stub; --debug
      # still produces the normal debug-signed APK.
      - name: Provide temporary Gradle signing properties
        shell: bash
        run: |
          rm -rf src-tauri/gen/android
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/tauritavern-ci-debug.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias tauritavern-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=TauriTavern CI, OU=Build, O=TauriTavern, C=US"
          mkdir -p src-tauri/gen/android
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=tauritavern-ci
          password=changeit
          storeFile=$RUNNER_TEMP/tauritavern-ci-debug.jks
          EOF


      - name: Reset generated Android project for new identifier
        shell: bash
        run: rm -rf src-tauri/gen/android

      - name: Build and collect mobile artifacts
        uses: tauri-apps/tauri-action@97cef2bd32ead607bcc2c6af5b40ce2f25d48e77
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          mobile: android
          args: --verbose --debug --apk
          uploadWorkflowArtifacts: true


      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauritavern-apk-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
